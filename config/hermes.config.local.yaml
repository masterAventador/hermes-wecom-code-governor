model:
  provider: openai-codex
  default: gpt-5.6-sol
  openai_runtime: auto
# 群会话按 chatid 共享：这个开关只在配置顶层生效（网关路由层读这里；
# platforms.wecom.extra 里的同名开关只影响适配器文本合批，两处需保持一致）。
group_sessions_per_user: false
# 本机常年走 Fake-IP 代理（所有域名都解析到 198.18.x 保留段），SSRF 的
# "解析到私网即拦截"在此环境恒为真，会拦掉企微图片等一切媒体下载。
# 放行私网解析；云元数据地址（169.254.169.254 等）不受此开关影响、仍被硬拦。
security:
  allow_private_urls: true
agent:
  reasoning_effort: medium
timeouts:
  tools:
    # Codex 改码 + 全量自测常态就要超过默认 420s；2 小时兜底，避免长任务
    # 被掐断后靠外层重试挽救（浪费轮次并造成重复"正在修改"通知）。
    concurrent_batch: 7200
session_reset:
  mode: both
  idle_minutes: 120
  at_hour: 4
toolsets:
  - hermes-cli
  - code_governor
display:
  tool_progress: 'off'
  interim_assistant_messages: false
  show_commentary: false
  # 忙碌中收到新消息时先应一声，不再已读不回。
  busy_ack_enabled: true
  runtime_footer:
    enabled: false
plugins:
  enabled:
    - hermes-wecom-code-governor
  entries:
    hermes-wecom-code-governor:
      settings:
        config_path: /Users/aventador/sourceCode/hermes-wecom-code-governor/config/governor.local.yaml
gateway:
  platforms:
    wecom:
      enabled: true
      gateway_restart_notification: false
      typing_indicator: false
      extra:
        dm_policy: allowlist
        allow_from:
          - woay8AEgAAw8MXiWiwMvDhA3H4jAQJWg
        group_policy: allowlist
        group_allow_from:
          - '*'
        groups:
          '*':
            allow_from:
              - woay8AEgAAw8MXiWiwMvDhA3H4jAQJWg
        # 群会话按 chatid 共享上下文：同群成员共用一套对话记录与任务状态。
        group_sessions_per_user: false
        thread_sessions_per_user: false
onboarding:
  seen:
    busy_input_prompt: true
