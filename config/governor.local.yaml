version: 1
runtime_root: /Users/aventador/sourceCode/hermes-wecom-code-governor/.runtime/worktrees

safety:
  card_ttl_seconds: 300
  max_changed_files: 100
  max_deleted_files: 5

project_discovery:
  enabled: true
  max_projects: 500

codex:
  model: gpt-5.6-sol
  reasoning_effort: xhigh
  binary: /opt/homebrew/bin/codex
delivery:
  wecom_file_max_bytes: 52428800
  cos:
    bucket: vpp-setup-1424480216
    region: ap-beijing
    key_prefix: electron-builds
    url_expires_seconds: 604800

projects:
  - id: aijd-demo
    name: AIJD测试项目
    path: /Users/aventador/sourceCode/bjx/aijd-demo
    base_branch: dev

  - id: vpp-digital-twin
    name: VPP数字孪生项目
    path: /Users/aventador/sourceCode/vpp-digital-twin
    base_branch: main
    # 合并到 main 成功后自动 git push origin main（会带上分支上所有未推提交）。
    push_on_merge: true
    validation_commands:
      - [npm, test]
    remote_actions:
      # 授权服务器上生成一个新的 unused 激活码；主机与命令固定，机器人只能按名触发。
      # host 用 ~/.ssh/config 里的别名 vpp-license，真实地址与账户不入库。
      - name: 生成激活码
        host: vpp-license
        argv: [/usr/local/bin/node, /opt/vpp-license/issue-code.mjs]
        timeout_seconds: 30
    http_actions:
      # 现场警示灯（YNL308）网关：1-8 是现场灯，9 是桌面测试灯。网关接口暂无鉴权，
      # 用户知情并接受（内网赶进度），正式交付前再补 token。
      # 灯支持四类显示模式：常亮/闪烁/熄灭、自定义 RGB、流水灯、蜂鸣器。蜂鸣器不登记
      # （机器人不该让现场响铃）；网关的 raw 帧透传也不登记，它能拼出任意指令，等于绕过白名单。
      - name: 设置警示灯颜色
        method: POST
        url: "http://49.233.213.109:7100/v1/lights/{light}/command"
        body_template: '{{"action":"color","color":"{color}","mode":"solid"}}'
        timeout_seconds: 10
        parameters:
          - name: light
            type: integer
            minimum: 1
            maximum: 9
            description: 灯号：1-8 是现场警示灯，9 是桌面测试灯
          - name: color
            type: choice
            choices: [red, yellow, green, blue, white, purple, cyan]
            description: 灯的颜色
      - name: 设置警示灯闪烁
        method: POST
        url: "http://49.233.213.109:7100/v1/lights/{light}/command"
        body_template: '{{"action":"color","color":"{color}","mode":"blink","blinkHz":{hz}}}'
        timeout_seconds: 10
        parameters:
          - name: light
            type: integer
            minimum: 1
            maximum: 9
            description: 灯号：1-8 是现场警示灯，9 是桌面测试灯
          - name: color
            type: choice
            choices: [red, yellow, green, blue, white, purple, cyan]
            description: 灯的颜色
          - name: hz
            type: choice
            choices: ['16', '8', '4', '2', '1', '0.5', '0.25']
            description: 每秒闪烁次数，数值越大越快；快闪用 8，慢闪用 1，特别慢用 0.25
      - name: 熄灭警示灯
        method: POST
        url: "http://49.233.213.109:7100/v1/lights/{light}/command"
        body_template: '{{"action":"off"}}'
        timeout_seconds: 10
        parameters:
          - name: light
            type: integer
            minimum: 1
            maximum: 9
            description: 灯号：1-8 是现场警示灯，9 是桌面测试灯
      - name: 设置警示灯流水效果
        method: POST
        url: "http://49.233.213.109:7100/v1/lights/{light}/command"
        body_template: '{{"action":"flow","color":"{color}","mode":"{effect}","speed":{speed}}}'
        timeout_seconds: 10
        parameters:
          - name: light
            type: integer
            minimum: 1
            maximum: 9
            description: 灯号：1-8 是现场警示灯，9 是桌面测试灯
          - name: color
            type: choice
            choices: [red, yellow, green, blue, white, purple, cyan]
            description: 灯的颜色
          - name: effect
            type: choice
            choices: [cycle, bounce, grow1, grow2]
            description: 流水样式：cycle 单灯循环、bounce 单灯往复、grow1/grow2 渐次点亮
          - name: speed
            type: integer
            minimum: 0
            maximum: 255
            description: 流水速度：0 最快，255 最慢，一般用 100
      - name: 自定义警示灯颜色
        method: POST
        url: "http://49.233.213.109:7100/v1/lights/{light}/command"
        body_template: '{{"action":"rgb","r":{r},"g":{g},"b":{b}}}'
        timeout_seconds: 10
        parameters:
          - name: light
            type: integer
            minimum: 1
            maximum: 9
            description: 灯号：1-8 是现场警示灯，9 是桌面测试灯
          - name: r
            type: integer
            minimum: 0
            maximum: 255
            description: 红色分量 0-255
          - name: g
            type: integer
            minimum: 0
            maximum: 255
            description: 绿色分量 0-255
          - name: b
            type: integer
            minimum: 0
            maximum: 255
            description: 蓝色分量 0-255
      - name: 查看警示灯状态
        method: GET
        url: "http://49.233.213.109:7100/v1/lights"
        timeout_seconds: 10
    seed_paths:
      - node_modules
    readable_paths:
      - /opt/homebrew
      - /System/Cryptexes
      - /System/Volumes/Preboot/Cryptexes/OS
    job:
      allowed_commands:
        - [npm, test]
        - [npm, run, "build:win", "--", "--config.electronDownload.isVerifyChecksum=false"]
        - [npm, run, "build:mac"]
        - [npm, run, "qa:screenshot"]
      gui_commands:
        - [npm, run, "qa:screenshot"]
      # mac 打包要 codesign 签名——macOS 钥匙串签名与写限制沙箱互斥，且登录
      # 钥匙串签名依赖真实 HOME，走受信执行档（无 seatbelt、真实 HOME，等价于
      # 用户在终端执行；cwd 仍是隔离 detached worktree）。签名身份用登录钥匙串、
      # 公证 p8 在真实 HOME 的 ~/.appstoreconnect，均无需额外注入。
      trusted_commands:
        - [npm, run, "build:mac"]
      environment:
        VPP_QA_USER_DATA: "${JOB_HOME}/Library/Application Support/vpp-digital-twin"
      artifact_globs:
        - release/*.exe
        - release/*.dmg
        - qa-artifacts/screenshots/*.png
      timeout_seconds: 1800
      home_seeds:
        - source: /Users/aventador/Library/Caches/electron
          target: Library/Caches/electron
        - source: /Users/aventador/Library/Caches/electron-builder
          target: Library/Caches/electron-builder
        - source: "/Users/aventador/Library/Application Support/vpp-digital-twin/licensing.json"
          target: "Library/Application Support/vpp-digital-twin/licensing.json"
      unix_sockets:
        - /private/var/run/mDNSResponder

